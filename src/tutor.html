<title>English Tutor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
<style>

/* Layout: library grid of covers → full-screen player sheet; mini-player docked at the bottom. Plasma-like: pill controls, 20px radii, teal accent. */
:root{
  --bg:#FFFFFF; --surface:#F2F3F5; --surface-2:#E6E8EB; --fg:#0B0C0E; --fg-2:rgba(11,12,14,.58); --fg-3:rgba(11,12,14,.36);
  --line:rgba(11,12,14,.08); --accent:#0B8783; --accent-hover:#08716E; --accent-fg:#FFFFFF; --accent-soft:rgba(11,135,131,.12);
  --danger:#E0352B; --scrim:rgba(0,0,0,.36); --shadow:0 8px 32px rgba(0,0,0,.10);
  --font:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-l:24px; --r-m:16px; --r-s:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080808; --surface:#161616; --surface-2:#242424; --fg:#FFFFFF; --fg-2:rgba(255,255,255,.58); --fg-3:rgba(255,255,255,.34);
  --line:rgba(255,255,255,.08); --accent:#2FC4BB; --accent-hover:#52D2CA; --accent-fg:#04201E; --accent-soft:rgba(47,196,187,.18);
  --danger:#FF5247; --scrim:rgba(0,0,0,.6); --shadow:0 8px 32px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#080808; --surface:#161616; --surface-2:#242424; --fg:#FFFFFF; --fg-2:rgba(255,255,255,.58); --fg-3:rgba(255,255,255,.34);
  --line:rgba(255,255,255,.08); --accent:#2FC4BB; --accent-hover:#52D2CA; --accent-fg:#04201E; --accent-soft:rgba(47,196,187,.18);
  --danger:#FF5247; --scrim:rgba(0,0,0,.6); --shadow:0 8px 32px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;overscroll-behavior-y:none}
html,body,.player{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.player::-webkit-scrollbar{display:none}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em;margin-right:auto}
.brand i{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg)}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px}
.seg button{height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{height:40px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:var(--surface)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger);color:#fff}

main{padding-block:8px 32px}
body.has-mini main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 14px}
.section-h h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.section-h span{color:var(--fg-2);font-size:13px}


.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:24px 16px}
.book{display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0;align-self:start;width:100%}
.book .cov{transition:transform .15s}
.book:hover .cov{transform:translateY(-2px)}
.book b{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book small{color:var(--fg-2);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cov{aspect-ratio:1;width:100%;max-width:100%;border-radius:var(--r-m);overflow:hidden;position:relative;background:var(--surface-2)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov .ph{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.cov .ph span{font-weight:700;font-size:clamp(14px,1.2em,22px);line-height:1.15;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cov .ph em{font-style:normal;font-size:12px;opacity:.8}
.cov .done{position:absolute;right:8px;top:8px;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:3px 8px}
.pbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px}

.add-tile{align-self:start;width:100%;aspect-ratio:1;border-radius:var(--r-m);border:1.5px dashed var(--fg-3);display:grid;place-items:center;color:var(--fg-2);text-align:center;font-size:13px;font-weight:500;padding:12px}
.add-tile:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.add-tile div{display:grid;justify-items:center;gap:8px}

/* empty */
.empty{margin-top:24px;border-radius:var(--r-l);background:var(--surface);padding:48px 24px;display:grid;justify-items:center;text-align:center;gap:14px;border:1.5px dashed transparent}
.empty.drag,.dropping .empty{border-color:var(--accent);background:var(--accent-soft)}
.empty .ic{width:72px;height:72px;border-radius:22px;background:var(--accent);color:#fff;display:grid;place-items:center}
.empty h2{margin:6px 0 0;font-size:24px;letter-spacing:-.01em;text-wrap:balance}
.empty p{margin:0;color:var(--fg-2);max-width:46ch}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.empty ul{list-style:none;padding:0;margin:14px 0 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.empty li{font-size:12px;color:var(--fg-2);background:var(--bg);border-radius:999px;padding:4px 10px}
.warn{margin-top:16px;padding:12px 16px;border-radius:var(--r-s);background:var(--accent-soft);font-size:13px}

/* mini player */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.mini .in{pointer-events:auto;max-width:720px;margin:0 auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.mini .row{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 10px}
.mini .open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.mini .cov{width:48px;flex:none;border-radius:10px}
.mini .cov .ph span{font-size:9px}.mini .cov .ph em{display:none}.mini .cov .ph{padding:5px}
.mini .t{min-width:0}
.mini .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t small{display:block;font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--fg)}
.ibtn:hover{background:var(--surface-2)}
.ibtn.acc{background:var(--accent);color:var(--accent-fg)}
.ibtn.acc:hover{background:var(--accent-hover)}
.mini .line{height:3px;background:var(--line)}
.mini .line i{display:block;height:100%;background:var(--accent)}

/* player sheet */
.player{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.player.open{transform:none;visibility:visible}
.player .bar-top{display:flex;align-items:center;gap:8px;padding-block:12px}
.player .bar-top .lbl{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--fg-2);letter-spacing:.04em;text-transform:uppercase}
.pl-body{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:48px;padding-block:8px 40px;align-items:start}
.pl-main{display:grid;gap:20px}
.pl-main .cov{border-radius:var(--r-l);box-shadow:var(--shadow);max-width:min(400px,38vh);width:100%;margin:0 auto}
.pl-main .cov .ph span{font-size:30px}
.pl-title h1{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.pl-title p{margin:4px 0 0;color:var(--fg-2)}
.pl-title .ch{margin-top:10px;font-size:14px;color:var(--fg);display:flex;gap:8px;align-items:baseline}
.pl-title .ch span{color:var(--accent);font-weight:600;white-space:nowrap}
.pl-title .ch em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--surface-2) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--surface-2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-top:-6px;border:0;transition:transform .1s}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:0}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);margin-top:2px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls .ibtn{width:52px;height:52px}
.ctrls .ibtn.big{width:76px;height:76px}
.skip{position:relative}
.skip small{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;padding-top:2px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.left-book{font-size:13px;color:var(--fg-2);text-align:center}

.chapters h2{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.chapters h2 span{font-size:13px;font-weight:500;color:var(--fg-2)}
.chlist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-l);overflow:hidden}
.chlist button{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;text-align:left;border-top:1px solid var(--line)}
.chlist li:first-child button{border-top:0}
.chlist button:hover{background:var(--surface-2)}
.chlist .n{font-size:13px;color:var(--fg-3);font-weight:600}
.chlist .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.chlist .d{font-size:13px;color:var(--fg-2)}
.chlist .cur{background:var(--accent-soft)}
.chlist .cur .n,.chlist .cur .nm{color:var(--accent);font-weight:600}
.chlist .past .nm{color:var(--fg-2)}

/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-wrap.show{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .22s}
.sheet-wrap.show .sheet{transform:none}
@media (min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:24px;padding-bottom:20px}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--surface-2);margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 12px;color:var(--fg-2);font-size:14px}
.opts{display:grid;gap:4px;margin-top:8px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:var(--r-s);text-align:left;font-weight:500}
.opt:hover{background:var(--surface)}
.opt.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt.dz{color:var(--danger)}
.speed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.speed-grid button{height:48px;border-radius:var(--r-s);background:var(--surface);font-weight:600}
.speed-grid button.sel{background:var(--accent);color:var(--accent-fg)}
.field{display:grid;gap:6px;margin-top:12px}
.field label{font-size:13px;color:var(--fg-2)}
.field input{height:48px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.sheet .acts{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.imp{position:fixed;left:0;right:0;bottom:0;z-index:45;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.imp .in{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;gap:14px;align-items:center}
.imp .cov{width:56px;flex:none;border-radius:12px}
.imp .cov .ph span{font-size:9px}.imp .cov .ph em{display:none}.imp .cov .ph{padding:5px}
.imp .tx{flex:1;min-width:0;display:grid;gap:6px}
.imp b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp small{font-size:13px;color:var(--fg-2)}
.imp .pbar{height:6px;border-radius:3px}
.imp .pbar i{transition:width .3s;border-radius:3px}
.imp em{font-style:normal;font-size:12px;color:var(--fg-3)}
.drop-ov{position:fixed;inset:0;z-index:70;background:var(--accent-soft);border:3px dashed var(--accent);display:none;place-items:center;font-size:20px;font-weight:700;color:var(--accent);backdrop-filter:blur(4px)}
.dropping .drop-ov{display:grid}

@media (max-width:820px){
  .pl-body{grid-template-columns:minmax(0,1fr);gap:32px}
  .pl-main .cov{max-width:min(320px,38vh)}
  .pl-title{text-align:center}.pl-title .ch{justify-content:center}
}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
  .seg button .tx{display:none}
  .ctrls{gap:4px}
  .ctrls .ibtn{width:48px;height:48px}
}
/* tabs + fragments */
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;margin-bottom:12px;width:max-content;max-width:100%}
.tabs button{height:36px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--fg-2);display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs span{font-weight:500;color:var(--fg-3);font-size:12px}
.pane-meta{font-size:13px;color:var(--fg-2);margin:0 0 10px 4px}
.chip.rec{background:var(--danger);color:#fff}
.chip.rec svg{display:none}
.chip.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.fr-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fr-hint{font-size:12px;color:var(--fg-2);margin:0 0 14px 4px;max-width:60ch}
.frlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.frag{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border-radius:var(--r-m);padding:10px}
.frag .ibtn{background:var(--bg);width:40px;height:40px}
.frag .ibtn svg{width:18px;height:18px}
.frag .fbody{flex:1;min-width:0;text-align:left;display:grid;gap:2px;padding:2px 4px}
.frag .ft{font-size:12px;color:var(--accent);font-weight:600}
.frag b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frag small{color:var(--fg-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fbadges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.fbadges i{font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.fr-empty{background:var(--surface);border-radius:var(--r-l);padding:24px;color:var(--fg-2);font-size:14px;display:grid;gap:8px;max-width:60ch}
.fr-empty b{color:var(--fg);font-size:16px}
.sheet{max-height:92vh;overflow-y:auto;overscroll-behavior:contain}
.sheet.wide{max-width:680px}
.field textarea{min-height:96px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:12px 14px;font:inherit;resize:vertical}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .v{flex:1;min-width:0;height:44px;border-radius:var(--r-s);background:var(--surface);display:flex;align-items:center;padding:0 14px;font-weight:600}
.stepper button{height:44px;padding:0 12px;border-radius:var(--r-s);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.stepper button:hover{background:var(--surface-2)}
.fd-meta{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:4px}
.tr{margin-top:12px}
.tr-box{display:grid;gap:10px;background:var(--surface);border-radius:var(--r-m);padding:14px}
.tr-box .btn{justify-self:start}
.tr-hint{font-size:13px;color:var(--fg-2)}
.tr-head{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2);margin-bottom:6px}
.tr-saved{color:var(--accent);text-transform:none;letter-spacing:0}
.tr-text{width:100%;min-height:120px;resize:none;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);color:var(--fg);padding:12px 14px;font:inherit;font-size:15px;line-height:1.5}
.tr-text:focus{outline:2px solid var(--accent);outline-offset:0}
.tr-prog.indet i{width:30%!important;animation:indet 1.2s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.selbar{display:grid;gap:8px;margin:10px 0;padding:12px;border-radius:var(--r-m);background:var(--accent-soft)}
.selbar .btn{justify-self:start}
.sel-q{font-size:13px;color:var(--fg-2);font-style:italic}
.tr + .row-acts{margin-top:12px}
.quote{margin:12px 0 0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 var(--r-s) var(--r-s) 0;font-size:14px;white-space:pre-wrap;max-height:220px;overflow-y:auto}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.dz{color:var(--danger)}

async function readID3(file) {
  try {
    const head = new Uint8Array(await file.slice(0,10).arrayBuffer());
    if (head[0]!==0x49||head[1]!==0x44||head[2]!==0x33) return {};

    const dec = (bytes, enc) => {
      try {
        if (enc===0) return new TextDecoder('windows-1251').decode(bytes);
        if (enc===1) return new TextDecoder(bytes[0]===0xFE?'utf-16be':'utf-16le').decode(bytes);
        if (enc===2) return new TextDecoder('utf-16be').decode(bytes);
        return new TextDecoder('utf-8').decode(bytes);
      } catch { return ''; }
    };
    const clean = s => s.replace(/^﻿/,'').replace(/\0+$/,'').split('\0')[0].trim();
    while (p + 10 <= buf.length) {
      const id = String.fromCharCode(buf[p],buf[p+1],buf[p+2],buf[p+3]);
      if (!/^[A-Z0-9]{4}$/.test(id)) break;
      const fs = ver===4 ? (buf[p+4]<<21)|(buf[p+5]<<14)|(buf[p+6]<<7)|buf[p+7] : ((buf[p+4]<<24)|(buf[p+5]<<16)|(buf[p+6]<<8)|buf[p+7])>>>0;
      const d = buf.subarray(p+10, p+10+fs);
      if (['TIT2','TALB','TPE1','TPE2'].includes(id) && d.length) out[id] = clean(dec(d.subarray(1), d[0]));
      if (id === 'APIC' && !out.APIC && d.length) {
        const enc = d[0]; let i = 1; let mime = '';
        while (i < d.length && d[i]) mime += String.fromCharCode(d[i++]);
        i += 2; // null + picture type
        if (enc===1||enc===2) { while (i+1 < d.length && (d[i]||d[i+1])) i+=2; i+=2; } else { while (i < d.length && d[i]) i++; i++; }
        out.APIC = new Blob([d.slice(i)], {type: mime && mime.includes('/') ? mime : 'image/jpeg'});

      p += 10 + fs;
    }

  } catch { return {}; }
}

async function mp3Duration(file) {
  try {
    const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    let off = 0;
    if (head[0]===0x49 && head[1]===0x44 && head[2]===0x33) {
      off = 10 + ((head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9]);
      if (head[5] & 0x10) off += 10;
    }
    const b = new Uint8Array(await file.slice(off, off + 65536).arrayBuffer());
    let i = 0;
    while (i + 4 < b.length && !(b[i]===0xFF && (b[i+1]&0xE0)===0xE0 && ((b[i+1]>>1)&3)===1 && (b[i+2]>>4)!==15 && (b[i+2]>>4)!==0)) i++;
    if (i + 4 >= b.length) return 0;
    const ver = (b[i+1]>>3)&3, brIdx = b[i+2]>>4, srIdx = (b[i+2]>>2)&3, mono = ((b[i+3]>>6)&3) === 3;
    const SR = {3:[44100,48000,32000], 2:[22050,24000,16000], 0:[11025,12000,8000]}[ver];

// свайп вниз закрывает нижнее окно и плеер
function swipeDown(el, close, scroller = el) {
  let y0 = null, dy = 0, t0 = 0, active = false;
  el.addEventListener('touchstart', e => {
    y0 = null;
    if (e.touches.length !== 1 || e.target.closest('input, textarea, select')) return;
    if (scroller.scrollTop > 0) return;
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); active = false;
  }, {passive: true});
  el.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (!active) {
      if (dy > 8) { active = true; el.style.transition = 'none'; }
      else { if (dy < -4) y0 = null; return; }
    }
    if (e.cancelable) e.preventDefault();
    el.style.transform = `translateY(${Math.max(0, dy)}px)`;
  }, {passive: false});
  const end = () => {
    if (y0 == null) return;
    y0 = null;
    if (!active) return;
    el.style.transition = '';
    const fast = dy / Math.max(1, Date.now() - t0) > 0.6;
    el.style.transform = '';
    if (dy > 100 || (fast && dy > 30)) close();
  };
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
}

/* ---------- transcripts: compact {d, s:[[start,end,text,[[w,s,e],...]],...]} ---------- */
function compactTranscript(j) {
  const segs = (j.segments || []).map(sg => {
    let ws = (sg.words || []).map(w => [String(w.w ?? w.word ?? '').trim(), +(+w.start).toFixed(2), +(+w.end).toFixed(2)]).filter(w => w[0]);
    if (!ws.length) {

      ws = toks.map((t, i) => [t, +(sg.start + dur * i / toks.length).toFixed(2), +(sg.start + dur * (i + 1) / toks.length).toFixed(2)]);
    }
    return [+(+sg.start).toFixed(2), +(+sg.end).toFixed(2), ws];

/* ---------- import ---------- */
const nat = (a, b) => a.localeCompare(b, 'en', { numeric: true, sensitivity: 'base' });

function commonPrefix(names) {

}
let importing = false;

    el = document.createElement('div'); el.id = 'imp'; el.className = 'imp'; el.setAttribute('role', 'status');
    el.innerHTML = '<div class="in"><div class="cov"><div class="ph" style="background:var(--accent)"><span></span></div></div><div class="tx"><b></b><small class="num"></small><div class="pbar"><i></i></div><em>Не закрывайте приложение, пока идёт добавление</em></div></div>';
    document.body.appendChild(el);
  }
  el.querySelector('b').textContent = done < total ? `Добавляю «${title}»` : 'Почти готово';
  el.querySelector('small').textContent = `${done} из ${total} · ${mbs(bytes)} из ${mbs(bytesTotal)} МБ`;
  el.querySelector('.pbar i').style.width = (bytesTotal ? bytes / bytesTotal * 100 : 0).toFixed(1) + '%';

const hideImport = () => $('#imp')?.remove();
async function importFiles(files, folderName) {
  if (importing) { toast('Подождите, добавляю предыдущую книгу'); return; }

  const jsons = files.filter(f => /\.json$/i.test(f.name));

    audios.sort((a, b) => nat(a.webkitRelativePath || a.name, b.webkitRelativePath || b.name));
    const trMap = new Map(jsons.map(f => [baseKey(f.name), f]));
    const id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    }

  if (!vocab.length) { m.innerHTML = `<div class="done-box"><b>Словарь пока пуст</b>Тапните по слову в тексте книги и нажмите «В словарь». Здесь появятся слова с переводом и фразой, где они встретились.</div>`; return; }
  m.innerHTML = `<p class="page-sub num">${vocab.length} ${plural(vocab.length, 'слово', 'слова', 'слов')}</p>
    <input class="vsearch" id="v-q" placeholder="Найти слово или перевод" autocomplete="off" aria-label="Поиск по словарю">
    <div class="vtools"><button class="btn ghost" id="v-copy">Скопировать списком</button></div>
    <div class="vlist" id="v-list"></div>`;
  const list = $('#v-list');
  const draw = q => {
    const items = vocab.filter(v => !q || v.word.toLowerCase().includes(q) || (v.translation_ru || '').toLowerCase().includes(q));
    list.innerHTML = items.map(v => `<button class="vitem" data-id="${v.id}"><b>${esc(v.word)}</b><span class="box">${(v.box || 0) >= 3 ? 'выучено' : (v.box || 0) > 0 ? 'учу' : 'новое'}</span><span class="tr">${esc(v.translation_ru || v.meaning_en || '')}</span></button>`).join('') || '<div class="done-box">Ничего не нашлось</div>';
    list.querySelectorAll('[data-id]').forEach(b => b.onclick = () => vocabSheet(vocab.find(v => v.id === b.dataset.id)));
  };
  draw('');
  $('#v-q').oninput = e => draw(e.target.value.trim().toLowerCase());
  $('#v-copy').onclick = async () => {
    const text = vocab.map(v => [v.word, v.translation_ru, v.sentence].join('\t')).join('\n');
    try { await navigator.clipboard.writeText(text); toast('Скопировано: можно вставить в таблицу или Anki'); } catch { toast('Не получилось скопировать'); }
  };
}
function vocabSheet(v) {
  if (!v) return;
  if (v.partKey) prepClip(v.partKey);
  const marked = esc(v.sentence || '').replace(new RegExp(`\\b(${v.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})\\b`, 'i'), '<mark>$1</mark>');
  openSheet(`<div class="lk-word">${esc(v.word)} <button class="ibtn" id="vs-say" aria-label="Произнести">${I.speaker}</button></div>
    <div class="lk-meta">${esc([v.pos, v.lemma && v.lemma.toLowerCase() !== v.word.toLowerCase() ? v.lemma : ''].filter(Boolean).join(' · '))}</div>
    <div class="lk-tr">${esc(v.translation_ru || '—')}</div>
    ${v.meaning_en ? `<div class="lk-mean">${esc(v.meaning_en)}</div>` : ''}${v.example ? `<div class="lk-ex">${esc(v.example)}</div>` : ''}${v.note ? `<div class="lk-note">${esc(v.note)}</div>` : ''}
    ${v.sentence ? `<div class="lk-sent">${marked}</div>` : ''}
    <div class="lk-acts">${v.partKey ? '<button class="btn ghost" id="vs-ph">Фраза из книги</button>' : ''}<button class="btn ghost dz" id="vs-del">Удалить из словаря</button></div>`, el => {
    el.querySelector('#vs-say').onclick = () => { if (!playClip(v.partKey, v.wordStart, v.wordEnd)) speak(v.word); };
    el.querySelector('#vs-ph')?.addEventListener('click', () => playClip(v.partKey, v.sentStart ?? v.wordStart - 2, v.sentEnd ?? v.wordEnd + 2));
    const del = el.querySelector('#vs-del');
    del.onclick = async () => { if (!del.dataset.sure) { del.dataset.sure = 1; del.textContent = 'Точно удалить?'; return; } vocab = vocab.filter(x => x !== v); await saveVocab(); closeSheet(); render(); paint(); };
  });
}

/* ---------- flashcards (Leitner) ---------- */
let session = null;
function renderCards() {
  const m = $('#main'), due = dueCards();
  if (!due.length) {
    m.innerHTML = `<div class="done-box"><b>${vocab.length ? 'На сейчас всё повторено' : 'Карточек пока нет'}</b>${vocab.length ? 'Слова вернутся по расписанию: через минуты, день, три, неделю и дальше.' : 'Сохраняйте слова из книги, и здесь появятся карточки для повторения.'}</div>`;
    return;
  }
  if (!session || session.idx >= session.queue.length) session = { queue: due, idx: 0, open: false, total: due.length };
  showCard();
}
function showCard() {
  const m = $('#main'), s = session;
  if (!s || s.idx >= s.queue.length) { session = null; return renderCards(); }
  const v = s.queue[s.idx];
  if (v.partKey) prepClip(v.partKey);
  m.innerHTML = `<div class="card"><div class="prog num">${s.idx + 1} из ${s.total}</div>
      <div class="word">${esc(v.word)} <button class="ibtn" id="c-say" aria-label="Произнести">${I.speaker}</button></div>
      ${s.open ? `<div class="tr">${esc(v.translation_ru || '—')}</div>${v.meaning_en ? `<div class="lk-mean">${esc(v.meaning_en)}</div>` : ''}` : `<div class="lk-meta">${esc(v.pos || '')}</div>`}
      ${v.sentence ? `<div class="sent">«${esc(v.sentence)}»</div>` : ''}</div>
    ${s.open ? `<div class="card-acts"><button class="btn g-again" data-g="again">Не помню</button><button class="btn g-hard" data-g="hard">Сложно</button><button class="btn g-good" data-g="good">Помню</button></div>`
      : `<div class="card-acts one"><button class="btn primary" id="c-open">Показать перевод</button></div>`}`;
  $('#c-say').onclick = () => { if (!playClip(v.partKey, v.wordStart, v.wordEnd)) speak(v.word); };
  $('#c-open')?.addEventListener('click', () => { s.open = true; showCard(); });
  $$('[data-g]').forEach(b => b.onclick = async () => {
    const g = b.dataset.g;
    if (g === 'again') v.box = 0; else if (g === 'good') v.box = Math.min(5, (v.box || 0) + 1);
    v.reps = (v.reps || 0) + 1; v.due = Date.now() + INTERVALS[v.box || 0];
    if ((v.box || 0) >= 3) { known.add(cleanTok(v.word)); saveKnown(); }
    await saveVocab();
    s.idx++; s.open = false; showCard();
  });
}

/* ---------- dictation ---------- */
function dictationSheet() {
  if (!tr) { toast('Для диктанта нужен текст этой части'); return; }
  audio.pause();
  let si = Math.max(0, activeSeg);
  const draw = el => {
    while (si < tr.segs.length - 1 && !tr.segs[si].t.trim()) si++;
    el.querySelector('#d-prog').textContent = `Фраза ${si + 1} из ${tr.segs.length}`;
    el.querySelector('#d-in').value = ''; el.querySelector('#d-res').hidden = true;
    setTimeout(() => playRange(tr.segs[si].s, tr.segs[si].e), 250);
  };
  openSheet(`<h3>Диктант</h3><p class="num" id="d-prog"></p>
    <div class="drow" style="margin-top:0"><button class="btn primary" id="d-play">Прослушать</button><button class="btn ghost" id="d-slow">Медленно</button></div>
    <div class="field"><label for="d-in">Запишите, что услышали</label><textarea class="dict-in" id="d-in" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea></div>
    <div class="drow"><button class="btn primary" id="d-check">Проверить</button><button class="btn ghost" id="d-show">Показать текст</button><button class="btn ghost" id="d-next">Следующая фраза</button></div>
    <div class="dict-res" id="d-res" hidden></div>`, el => {
    el.querySelector('#d-play').onclick = () => playRange(tr.segs[si].s, tr.segs[si].e);
    el.querySelector('#d-slow').onclick = () => playRange(tr.segs[si].s, tr.segs[si].e, 0.7);
    el.querySelector('#d-next').onclick = () => { si = Math.min(tr.segs.length - 1, si + 1); draw(el); };
    el.querySelector('#d-show').onclick = () => { const r = el.querySelector('#d-res'); r.hidden = false; r.innerHTML = `<div class="s">${esc(tr.segs[si].t)}</div>`; };
    el.querySelector('#d-check').onclick = () => {
      const tok = s => s.split(/\s+/).filter(Boolean).map(raw => ({ raw, n: raw.toLowerCase().replace(/[^a-z0-9']/g, '') })).filter(x => x.n);
      const right = tok(tr.segs[si].t), mine = tok(el.querySelector('#d-in').value);
      const a = right.map(x => x.n), b = mine.map(x => x.n), n = a.length, mm = b.length;
      const dp = Array.from({ length: n + 1 }, () => new Int32Array(mm + 1));
      for (let i = n - 1; i >= 0; i--) for (let j = mm - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      const ok = new Array(n).fill(false); let i = 0, j = 0;
      while (i < n && j < mm) { if (a[i] === b[j]) { ok[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
      const got = ok.filter(Boolean).length, pct = Math.round(got / (n || 1) * 100);
      const r = el.querySelector('#d-res'); r.hidden = false;
      r.innerHTML = `<b class="num">Угадано ${got} из ${n} слов · ${pct}%</b><div class="s">${right.map((x, k) => `<span class="${ok[k] ? 'dict-ok' : 'dict-miss'}">${esc(x.raw)}</span>`).join(' ')}</div>`;
    };
    draw(el);
  });
}

/* ---------- settings ---------- */
function settingsSheet() {
  const th = getTheme();
  const thBtn = (k, label) => `<button data-th="${k}" aria-pressed="${th === k}">${label}</button>`;
  openSheet(`<h3>Настройки</h3>
    <div class="sh-sub">Тема</div>
    <div class="seg set-seg" role="group" aria-label="Тема">${thBtn('light', 'Светлая')}${thBtn('dark', 'Тёмная')}${thBtn('auto', 'Как в системе')}</div>
    <div class="sh-sub">Учёба</div>
    <div class="opts">
      <button class="opt" data-a="goal">Цель на день: ${goalMin()} мин <span>›</span></button>
      <button class="opt" data-a="lvl">Подчёркивание: ${({ less: 'меньше', more: 'больше', off: 'выключено' })[level]} <span>›</span></button>
      <button class="opt" data-a="ai">ИИ для разбора слов: ${aiLabel()} <span>›</span></button>
    </div>`, el => {
    el.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { setTheme(b.dataset.th); el.querySelectorAll('[data-th]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    el.querySelector('[data-a=goal]').onclick = goalSheet;
    el.querySelector('[data-a=lvl]').onclick = levelSheet;
    el.querySelector('[data-a=ai]').onclick = () => keySheet();
  });
}

/* ---------- daily goal: minutes of listening + reading ---------- */
let days = {}, lastAct = 0, readTick = 0, daysT = null;
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const goalMin = () => +lsGet('et-goal') || 20;
const todaySec = () => days[dayKey()] || 0;
function addPractice(sec) {
  if (!(sec > 0)) return;
  const k = dayKey(), before = days[k] || 0, goal = goalMin() * 60;
  days[k] = before + sec;
  if (before < goal && days[k] >= goal) toast(`Цель на сегодня выполнена · ${streakText(streak())}`, 3500);
  clearTimeout(daysT); daysT = setTimeout(() => putMeta('days', days), 3000);
  updateGoalCard();
}
// reading: the reader is open in «Читать», the app is on screen and you touched or scrolled within the last 90 s
const markActive = () => { lastAct = Date.now(); };
['scroll', 'touchstart', 'click'].forEach(ev => document.addEventListener(ev, markActive, { passive: true, capture: true }));
setInterval(() => {
  const now = Date.now();
  const reading = cur?.mode === 'read' && $('#reader')?.classList.contains('open') && document.visibilityState === 'visible' && audio.paused && now - lastAct < 90000;
  if (reading && readTick) addPractice(Math.min(now - readTick, 10000) / 1000);
  readTick = now;
}, 5000);
function streak() {
  const goal = goalMin() * 60, d = new Date();
  let n = 0;
  if ((days[dayKey(d)] || 0) < goal) d.setDate(d.getDate() - 1);   // today still counts until midnight
  while ((days[dayKey(d)] || 0) >= goal) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const streakText = n => n ? `серия ${n} ${plural(n, 'день', 'дня', 'дней')}` : 'серия начнётся сегодня';
function forecast() {
  const b = cur || [...books].sort((a, c) => (c.last || c.added) - (a.last || a.added))[0];
  if (!b) return '';
  const left = (bookTotal(b) - bookDone(b)) / (b.speed || 1);
  if (left < 60) return `«${b.title}» дослушана`;
  const n = Math.ceil(left / (goalMin() * 60)), end = new Date(); end.setDate(end.getDate() + n);
  return `«${b.title}»: ещё ≈${n} ${plural(n, 'день', 'дня', 'дней')}, к ${end.toLocaleDateString('ru', { day: 'numeric', month: 'long' })}`;
}
function goalCardHTML() {
  if (!books.length) return '';
  const done = Math.floor(todaySec() / 60), goal = goalMin(), p = Math.min(1, todaySec() / (goal * 60));
  return `<button class="goal" id="goal" aria-label="Цель на день">
    <span class="g-ring" style="--p:${(p * 100).toFixed(1)}%"><span class="num">${p >= 1 ? '✓' : Math.round(p * 100) + '%'}</span></span>
    <span class="g-tx"><b class="num" id="g-today">Сегодня ${done} из ${goal} мин</b><small id="g-sub">${esc(streakText(streak()))} · ${esc(forecast())}</small></span></button>`;
}
function updateGoalCard() {
  const el = $('#goal'); if (!el) return;
  const done = Math.floor(todaySec() / 60), goal = goalMin(), p = Math.min(1, todaySec() / (goal * 60));
  const t = `Сегодня ${done} из ${goal} мин`;
  if ($('#g-today').textContent === t) return;
  $('#g-today').textContent = t;
  el.querySelector('.g-ring').style.setProperty('--p', (p * 100).toFixed(1) + '%');
  el.querySelector('.g-ring span').textContent = p >= 1 ? '✓' : Math.round(p * 100) + '%';
  $('#g-sub').textContent = `${streakText(streak())} · ${forecast()}`;
}
function goalSheet() {
  const g = goalMin(), week = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); week.push({ d, m: Math.floor((days[dayKey(d)] || 0) / 60) }); }
  const max = Math.max(g, ...week.map(x => x.m));
  openSheet(`<h3>Цель на день</h3>
    <p>Засчитывается и слушание, и чтение: время, пока играет книга, и время в режиме «Читать», пока вы листаете или тапаете по словам. Серия растёт за каждый день, когда цель выполнена.</p>
    <div class="week">${week.map(x => `<div class="wk${x.m >= g ? ' ok' : ''}"><i style="height:${Math.max(4, x.m / max * 64)}px"></i><span class="num">${x.m}</span><small>${x.d.toLocaleDateString('ru', { weekday: 'short' })}</small></div>`).join('')}</div>
    <div class="speed-grid">${[10, 15, 20, 30, 45, 60].map(v => `<button data-g="${v}" class="num ${v === g ? 'sel' : ''}">${v} мин</button>`).join('')}</div>`, el => {
    el.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { lsSet('et-goal', b.dataset.g); closeSheet(); render(); });
  });
}

/* ---------- mini player ---------- */
function renderMini() {
  const el = $('#mini');
  const show = !!cur && !$('#reader').classList.contains('open');
  document.body.classList.toggle('has-mini', !!cur);
  if (!show) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="in"><div class="row"><button class="open" id="m-open"><div class="cov">${coverHTML(cur)}</div><div class="t"><b>${esc(cur.title)}</b><small>${cur.parts.length > 1 ? `Часть ${cur.pos.part + 1} из ${cur.parts.length}` : (cur.author ? esc(cur.author) : 'Аудиокнига')}</small></div></button>
    <button class="ibtn acc" id="m-play" aria-label="${audio.paused ? 'Слушать' : 'Пауза'}">${audio.paused ? I.play : I.pause}</button></div></div>`;
  $('#m-open').onclick = () => openBook(cur);
  $('#m-play').onclick = toggle;
}

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'Escape') { if ($('#sheet')) closeSheet(); else if ($('#reader').classList.contains('open')) history.back(); return; }
  if (!cur) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') sentenceStep(-1);
  else if (e.key === 'ArrowRight') sentenceStep(1);
  else if (e.key === 'r') replaySentence();
});

/* ---------- boot ---------- */
(async () => {
  try { books = await allBooks() || []; } catch { books = []; }
  try { vocab = (await getMeta('vocab')) || []; known = new Set((await getMeta('known')) || []); lookCache = (await getMeta('cache')) || {}; days = (await getMeta('days')) || {}; } catch {}
  rebuildVocabSet();
  render();
  await loadFrequency();
  const last = [...books].filter(b => b.last).sort((a, b) => b.last - a.last)[0];
  if (last) { cur = last; renderMini(); }
  await loadCatalog(); render();
  if (location.hash === '#demo' || location.hash === '#holmes') { history.replaceState(null, '', location.pathname); const c = catalog.find(x => x.id === 'holmes'); if (c) addFromLibrary(c); }
})();
})();
</script>
